[pytest]
testpaths = tests

# Integration tests reach the real OpenAI Realtime API and cost money, so they
# are deselected by default. `pytest tests -q` therefore stays free, offline
# and hardware-free. Run them deliberately with:
#
#     python -m pytest tests -m realtime -q
#
addopts = -m "not integration"

markers =
    integration: reaches a real external service; deselected by default
    realtime: uses the live OpenAI Realtime API and consumes paid usage
    trace: permanent conversation-trace gate (Phase 6.12). A live call must be
        readable end to end, and no credential, card number, secret or balance
        may appear in the trace table, the API response or the logs. Run with
        `python -m pytest -m trace -q`.
    balance_determinism: permanent order-invariance release gate (Phase 6.11).
        The same authenticated customer asking the same question of the same
        database must get the same banking answer, whichever valid order the
        model calls its tools in. Run with
        `python -m pytest -m balance_determinism -q`. Never delete, weaken or
        re-baseline one to make a change pass.
    reliability: permanent production reliability gate (Phase 7.4). Every wait
        on the database is bounded, stopping this process ends the calls it is
        carrying rather than abandoning them, and no observability write may
        stand in front of a release. Run with
        `python -m pytest -m reliability -q`. Runnable with PostgreSQL switched
        off, on purpose: half of what it asserts is what this process does when
        the database cannot be reached.
    customer_trust: permanent customer-trust release gate (Phase 6.10).
        What the caller is told must match what the bank believes. Run with
        `python -m pytest -m customer_trust -q`. These are non-negotiable:
        a failure means the change is wrong, not that the test needs updating.
        Never delete, weaken or re-baseline one to make a change pass.
